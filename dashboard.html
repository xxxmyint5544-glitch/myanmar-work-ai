<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F3D3E">
<title>ပင်မစာမျက်နှာ — မြန်မာလုပ်ငန်းကူ AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="app">

  <div class="page">
    <div class="small muted" id="dateLabel">—</div>

    <div class="ledger mt-8">
      <div class="label">ယနေ့ ရောင်းအား</div>
      <div class="amount" id="ledgerAmount">0 ကျပ်</div>
      <div class="ledger-grid">
        <div class="ledger-mini">
          <div class="l">💵 လက်ငင်း</div>
          <div class="v" id="miniCash">0</div>
        </div>
        <div class="ledger-mini">
          <div class="l">🤝 အကြွေး</div>
          <div class="v" id="miniCredit">0</div>
        </div>
        <div class="ledger-mini">
          <div class="l">💸 အသုံးစရိတ်</div>
          <div class="v" id="miniExpense">0</div>
        </div>
        <div class="ledger-mini">
          <div class="l">📈 အသားတင်အမြတ်</div>
          <div class="v" id="miniProfit">0</div>
        </div>
      </div>
    </div>

    <button class="btn btn-outline btn-block mt-12" id="addExpenseBtn">💸 ယနေ့ အသုံးစရိတ် ထည့်ရန်</button>

    <div class="stat-row mt-16">
      <div class="stat">
        <div class="l">ရရန် အကြွေး</div>
        <div class="v" id="statReceivable">0</div>
      </div>
      <div class="stat warn">
        <div class="l">ပေးရန် အကြွေး</div>
        <div class="v" id="statPayable">0</div>
      </div>
      <div class="stat gold">
        <div class="l">ပစ္စည်းအမျိုးအစား</div>
        <div class="v" id="statStock">0</div>
      </div>
      <div class="stat warn">
        <div class="l">Stock နည်းနေသော</div>
        <div class="v" id="statLow">0</div>
      </div>
    </div>

    <div class="section-title">
      <span>✨ AI ကို မေးမြန်းပါ</span>
    </div>
    <div class="card">
      <div class="flex gap-8">
        <input id="quickAsk" type="text" placeholder="ဥပမာ — ဒီနေ့ ရောင်းအားတွက်ပေး" style="flex:1;border:1.5px solid var(--line);border-radius:10px;padding:12px 13px;background:var(--paper);color:var(--ink);font-size:14.5px;">
        <button class="btn btn-gold" id="quickAskBtn" style="min-height:44px;padding:10px 16px;">မေးမည်</button>
      </div>
    </div>

    <div class="section-title">
      <span>⚠️ Stock နည်းနေသော ပစ္စည်း</span>
      <a class="link" href="inventory.html">အားလုံးကြည့်ရန်</a>
    </div>
    <div class="card" id="lowStockList"></div>

    <div class="section-title">
      <span>🧾 ယနေ့ ရောင်းအားမှတ်တမ်း</span>
      <a class="link" href="sales.html">အားလုံးကြည့်ရန်</a>
    </div>
    <div class="card" id="recentSalesList"></div>
  </div>

  <a href="sales.html" class="fab" title="ရောင်းအားထည့်ရန်">+</a>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="expenseSheet" style="display:none;">
  <div class="handle"></div>
  <div class="sheet-title">သုံးစရိတ် ထည့်ရန်</div>

  <div class="field">
    <label>အမျိုးအစား</label>
    <div class="chip-row" id="expenseCategoryChips"></div>
    <div class="flex gap-8 mt-8">
      <input type="text" id="newCategoryInput" placeholder="အမျိုးအစားအသစ် ထည့်ရန်..." style="flex:1;padding:9px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper-raised);color:var(--ink);font-size:13px;">
      <button class="btn btn-outline" id="addCategoryBtn" style="min-height:38px;padding:8px 14px;font-size:13px;">+ ထည့်</button>
    </div>
  </div>

  <div class="field">
    <label>ပမာဏ</label>
    <input type="number" id="expenseAmount" min="0" placeholder="0">
  </div>
  <div class="field">
    <label>မှတ်ချက် (မဖြစ်မနေ မလို)</label>
    <input type="text" id="expenseNote" placeholder="ဥပမာ — ဆိုင်ပစ္စည်း သယ်ယူခ">
  </div>

  <div class="flex gap-8 mt-12">
    <button class="btn btn-outline grow" id="cancelExpenseBtn">ပယ်ဖျက်မည်</button>
    <button class="btn btn-primary grow" id="saveExpenseBtn">သိမ်းဆည်းမည်</button>
  </div>
</div>

<script src="db.js"></script>
<script src="utils.js"></script>
<script src="app.js"></script>
</body>
</html>
