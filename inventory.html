<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3D3E">
<title>ပစ္စည်းစာရင်း — မြန်မာလုပ်ငန်းကူ AI</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<div class="app">

  <div class="page">
    <input type="text" id="searchBox" placeholder="🔍 ပစ္စည်းအမည် ဒါမှမဟုတ် ကုဒ် ရှာရန်" style="width:100%;padding:12px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper-raised);color:var(--ink);font-size:14.5px;">

    <div class="stat-row mt-16">
      <div class="stat">
        <div class="l">ပစ္စည်းအမျိုးအစား</div>
        <div class="v" id="statTotalItems">0</div>
      </div>
      <div class="stat warn">
        <div class="l">Stock နည်းနေသော</div>
        <div class="v" id="statLowItems">0</div>
      </div>
    </div>

    <div class="section-title"><span>📦 ပစ္စည်းစာရင်း</span></div>
    <div class="card" id="itemList"></div>
  </div>

  <a href="#" class="fab" id="fabAdd" title="ပစ္စည်းအသစ်ထည့်ရန်">+</a>
</div>

<div class="overlay" id="overlay"></div>
<div class="sheet" id="itemSheet" style="display:none;">
  <div class="handle"></div>
  <div class="sheet-title" id="itemSheetTitle">ပစ္စည်းအသစ် ထည့်ရန်</div>

  <input type="hidden" id="itemId">

  <div class="field">
    <label>ပစ္စည်းအမည်</label>
    <input type="text" id="itemName" placeholder="ဥပမာ — ဆန်အိတ် (၅၀ကီလို)">
  </div>
  <div style="display:flex;gap:8px;">
    <div class="field" style="flex:1;">
      <label>ကုဒ် (မဖြစ်မနေ မလို)</label>
      <input type="text" id="itemCode" placeholder="SKU-001">
    </div>
    <div class="field" style="flex:1;">
      <label>အနေအထား (unit)</label>
      <input type="text" id="itemUnit" placeholder="အိတ် / လုံး / ပုလင်း">
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <div class="field" style="flex:1;">
      <label>ဝယ်ဈေး</label>
      <input type="number" id="itemBuyPrice" min="0" placeholder="0">
    </div>
    <div class="field" style="flex:1;">
      <label>ရောင်းဈေး</label>
      <input type="number" id="itemSellPrice" min="0" placeholder="0">
    </div>
  </div>
  <div style="display:flex;gap:8px;">
    <div class="field" style="flex:1;">
      <label>လက်ကျန် အရေအတွက်</label>
      <input type="number" id="itemStock" min="0" placeholder="0">
    </div>
    <div class="field" style="flex:1;">
      <label>Stock နည်းရင် သတိပေးမည့် ဂဏန်း</label>
      <input type="number" id="itemLowThreshold" min="0" placeholder="5">
    </div>
  </div>

  <div class="flex gap-8 mt-12">
    <button class="btn btn-outline grow" id="cancelItemBtn">ပယ်ဖျက်မည်</button>
    <button class="btn btn-primary grow" id="saveItemBtn">သိမ်းဆည်းမည်</button>
  </div>
  <button class="btn btn-danger btn-block mt-12" id="deleteItemBtn" style="display:none;">ဤပစ္စည်းကို ဖျက်မည်</button>
</div>

<div class="overlay" id="overlay2"></div>
<div class="sheet" id="stockSheet" style="display:none;">
  <div class="handle"></div>
  <div class="sheet-title">Stock ပြင်ဆင်ရန် — <span id="stockItemName"></span></div>
  <div class="tabs">
    <button class="active" data-mode="in">ပစ္စည်း ဝင်</button>
    <button data-mode="out">ပစ္စည်း ထွက်</button>
  </div>
  <div class="field">
    <label>အရေအတွက်</label>
    <input type="number" id="stockAdjustQty" min="1" value="1">
  </div>
  <button class="btn btn-primary btn-block" id="applyStockBtn">သိမ်းဆည်းမည်</button>
</div>

<script src="db.js"></script>
<script src="utils.js"></script>
<script src="inventory.js"></script>
</body>
</html>
